name: ci

on:
    push:
        branches: [ main ]
    pull_request:
    workflow_dispatch:

# read-only: nothing here tags or publishes, so a write-scoped token would only ever be an offer
permissions:
    contents: read

# A second push to the same branch makes the first run's answer worthless before it finishes.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # these read the same bytes on every interpreter, so once rather than three times; php-cs-fixer
    # would also print a meaningless min-version warning above composer.json's floor
    static:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
                    coverage: none
            -   name: validate the manifest
                run: composer validate --strict
            -   name: resolve the composer cache directory
                id: composer-cache
                run: echo "path=$(composer config --global cache-files-dir)" >> "${GITHUB_OUTPUT}"
            -   uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.path }}
                    key: composer-8.2-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-8.2-
            # installed, never resolved: a job resolving its own would certify this code with a different analyser
            -   name: install the locked dependencies
                run: composer install --no-progress --no-interaction --prefer-dist
            -   name: cs check
                run: composer cs-check

    # phpstan's inference follows the interpreter, so it belongs in the matrix. The integration group
    # needs no service here, hence no job of its own; --fail-on-skipped because a suite that skips
    # silently is indistinguishable from one that passes
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ '8.2', '8.3', '8.4' ]
        steps:
            -   uses: actions/checkout@v4
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    coverage: none
            -   name: resolve the composer cache directory
                id: composer-cache
                run: echo "path=$(composer config --global cache-files-dir)" >> "${GITHUB_OUTPUT}"
            -   uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.path }}
                    key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-${{ matrix.php }}-
            -   name: install the locked dependencies
                run: composer install --no-progress --no-interaction --prefer-dist
            # simple-phpunit builds a phpunit tree composer.lock does not describe; cached after the
            # install, since composer owns vendor/ and would clean a pre-restored directory back out
            -   uses: actions/cache@v4
                with:
                    path: vendor/bin/.phpunit
                    key: phpunit-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
            -   name: phpstan
                run: composer phpstan
            -   name: test
                run: composer test
            -   name: integration suite
                run: composer test-integration -- --fail-on-skipped

    # the package ships sources for a host to bundle, so there is no package-lock to install from;
    # the typescript version is read out of the dev image's Dockerfile so the two cannot drift
    js:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            # the major matches the dev image's ( alpine's nodejs ); node --test needs nothing newer
            -   uses: actions/setup-node@v4
                with:
                    node-version: '24'
            -   name: read the pinned typescript version from the dev image
                id: typescript
                run: |
                    set -euo pipefail
                    TYPESCRIPT_VERSION="$(sed -n 's/^ARG TYPESCRIPT_VERSION=//p' .dev/docker/Dockerfile)"
                    if [ -z "${TYPESCRIPT_VERSION}" ]; then
                        echo "no ARG TYPESCRIPT_VERSION in .dev/docker/Dockerfile" >&2
                        exit 1
                    fi
                    echo "version=${TYPESCRIPT_VERSION}" >> "${GITHUB_OUTPUT}"
            -   name: install typescript
                run: npm install -g typescript@${{ steps.typescript.outputs.version }}
            -   name: typecheck
                working-directory: assets/react
                run: npm run --silent typecheck
            -   name: test
                working-directory: assets/react
                run: node --test

    # `--locked` reads composer.lock, so no vendor/ and no install step; kept out of `composer check`
    # because it is the only section needing the network
    audit:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
                    coverage: none
            -   name: audit the locked dependencies
                run: composer deps-audit
